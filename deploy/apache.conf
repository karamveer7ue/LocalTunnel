# Apache + PHP-FPM site for Tunnel, for a server you control (a VPS).
# Replace tunnel.example.com, the paths, and the PHP-FPM socket with your own.
# Needs mod_ssl, mod_rewrite, mod_proxy, mod_proxy_fcgi, and mod_env.
# On shared hosting you cannot use this file; the .htaccess in server/ covers what it can.

<VirtualHost *:80>
    ServerName tunnel.example.com
    # Keep this alias for subdomain tunnels (base_domain in config.php).
    ServerAlias *.tunnel.example.com
    Redirect permanent / https://tunnel.example.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName tunnel.example.com
    ServerAlias *.tunnel.example.com

    SSLEngine on
    # For subdomain tunnels this must be a wildcard certificate covering *.tunnel.example.com.
    SSLCertificateFile /etc/letsencrypt/live/tunnel.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/tunnel.example.com/privkey.pem

    DocumentRoot /var/www/tunnel/server
    <Directory /var/www/tunnel/server>
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php-fpm.sock|fcgi://localhost/"
    </FilesMatch>
    <Proxy "fcgi://localhost/">
        # Pass streamed responses on as PHP flushes them, and give slow local apps time.
        ProxySet flushpackets=on timeout=300
    </Proxy>
</VirtualHost>
