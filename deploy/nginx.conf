# nginx + PHP-FPM site for Tunnel, for a server you control (a VPS).
# Replace tunnel.example.com, the paths, and the PHP-FPM socket with your own.

server {
    listen 80;
    listen [::]:80;
    # Keep *.tunnel.example.com for subdomain tunnels (base_domain in config.php).
    server_name tunnel.example.com *.tunnel.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tunnel.example.com *.tunnel.example.com;

    # For subdomain tunnels this must be a wildcard certificate covering *.tunnel.example.com.
    ssl_certificate     /etc/letsencrypt/live/tunnel.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tunnel.example.com/privkey.pem;

    root /var/www/tunnel/server;

    # Tunnel limits uploads itself (max_upload_mb in config.php). The buffer holds the
    # pieces tunnel.py uploads (up to 512 KB) in memory instead of temporary files.
    client_max_body_size 0;
    client_body_buffer_size 1m;

    # Every request goes to index.php, including paths that look like files: on a tunnel's
    # subdomain they belong to the tunneled app.
    location / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_PROXY "";
        # Stream responses as PHP produces them, and give slow local apps time.
        fastcgi_buffering off;
        fastcgi_read_timeout 300s;
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }
}
